<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M3U Playlist Player</title>
    <script src="https://unpkg.com/preact@10.15.1/dist/preact.umd.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <style>
      :root {
        --primary-color: #4f46e5; /* Rich indigo */
        --hover-color: #4338ca; /* Deeper indigo for hover */
        --bg-color: #e6f0ff; /* Lighter, more noticeable blue tint */
        --text-color: #1e293b; /* Slate gray text */
        --border-color: #e2e8f0; /* Subtle border */
        --gradient-start: #ffffff; /* Gradient start color */
        --gradient-end: #e6f0ff; /* Matching end color for gradient */
      }

      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
        background: linear-gradient(
          135deg,
          var(--gradient-start),
          var(--gradient-end)
        );
        color: var(--text-color);
      }

      #app {
        display: flex;
        flex-direction: row-reverse;
        width: 100%;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        background: white;
        margin: 20px;
        border-radius: 12px;
        overflow: hidden;
      }

      .playlist {
        width: 30%;
        min-width: 250px;
        overflow-y: auto;
        padding: 20px;
        border-left: 1px solid var(--border-color);
        background: white;
      }

      .media {
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        padding: 20px;
        min-height: 300px;
      }

      .playlist-item {
        padding: 12px 16px;
        cursor: pointer;
        border-radius: 8px;
        margin-bottom: 8px;
        transition: all 0.2s ease;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
      }

      .playlist-item:hover {
        background: linear-gradient(
          to right,
          var(--primary-color),
          var(--hover-color)
        );
        color: white;
        transform: translateX(5px);
        box-shadow: 0 4px 12px rgba(41, 98, 255, 0.2);
      }

      video {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }

      p {
        color: #666;
        font-size: 1.1em;
      }

      /* Custom scrollbar */
      .playlist::-webkit-scrollbar {
        width: 8px;
      }

      .playlist::-webkit-scrollbar-track {
        background: var(--bg-color);
      }

      .playlist::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      .playlist::-webkit-scrollbar-thumb:hover {
        background: var(--primary-color);
      }

      /* Loading animation */
      @keyframes pulse {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }

      .loading {
        animation: pulse 1.5s infinite;
        padding: 20px;
        text-align: center;
        color: var(--primary-color);
      }

      /* Add responsive styles */
      @media (max-width: 768px) {
        #app {
          flex-direction: column-reverse;
          margin: 0;
          border-radius: 0;
        }

        .playlist {
          width: 100%;
          max-height: 30vh;
          border-left: none;
          border-top: 1px solid var(--border-color);
        }

        .media {
          height: 70vh;
        }
      }

      /* Add new styles for the playlist selector */
      .playlist-selector {
        margin-bottom: 16px;
        width: 100%;
        padding: 8px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: white;
        color: var(--text-color);
        cursor: pointer;
      }

      .playlist-selector:hover {
        border-color: var(--primary-color);
      }

      .file-input-wrapper {
        margin-bottom: 16px;
        width: 100%;
      }

      .file-input-button {
        width: 100%;
        padding: 8px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .file-input-button:hover {
        background: var(--hover-color);
      }

      .play-all-button {
        width: 100%;
        padding: 8px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s ease;
        margin-bottom: 16px;
      }

      .play-all-button:hover {
        background: var(--hover-color);
      }

      /* Add modal styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-content {
        background: white;
        padding: 20px;
        border-radius: 12px;
        max-width: 80%;
        max-height: 80vh;
        overflow-y: auto;
        position: relative;
      }

      .modal-close {
        position: absolute;
        top: 10px;
        right: 10px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        cursor: pointer;
      }

      .modal-text {
        white-space: pre-wrap;
        font-family: monospace;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/plain" id="playlist-data">
      #EXTM3U
      #EXTINF:-1,Big Buck Bunny (Sample)
      https://www.w3schools.com/html/mov_bbb.mp4
      #EXTINF:-1,HTML5 Test Video
      #EXTVLCOPT:start-time=6
      https://www.w3schools.com/html/movie.mp4
      #EXTINF:-1,Elephants Dream (Sample)
      https://archive.org/download/ElephantsDream/ed_hd.mp4
      #EXTINF:-1,Sintel Trailer
      https://download.blender.org/durian/trailer/sintel_trailer-720p.mp4
      #EXTINF:-1,Test Pattern Audio
      https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3
    </script>

    <script>
      const { h, render, Component } = preact
      const html = htm.bind(h)

      class M3UPlayer extends Component {
        /**
         * Initialize component state and refs
         * @constructor
         * @param {Object} props - Component properties
         */
        constructor(props) {
          super(props)
          this.state = {
            playlist: [],
            currentMedia: null,
            nextMedia: null,
            savedPlaylists: [],
            selectedPlaylist: null,
            directoryHandle: null,
            fileHandles: new Map(),
            currentIndex: 0,
            isPlayingAll: false,
            showModal: false,
            modalContent: ''
          }
          this.videoRef = null
          this.nextVideoRef = null
        }

        /**
         * Load playlist data after component mounts
         * Checks URL parameters for playlist or loads fallback
         */
        componentDidMount() {
          // Load saved playlists from localStorage
          this.loadSavedPlaylists()

          const urlParams = new URLSearchParams(window.location.search)
          const playlistURL = urlParams.get('playlist')

          if (playlistURL) {
            this.fetchPlaylist(playlistURL).then(() => {
              // Play first item after playlist is loaded
              if (this.state.playlist && this.state.playlist.length > 0) {
                this.playMedia(this.state.playlist[0], 0)
              }
            })
          } else {
            this.loadFallbackPlaylist()
            // Play first item from fallback playlist
            setTimeout(() => {
              if (this.state.playlist && this.state.playlist.length > 0) {
                this.playMedia(this.state.playlist[0], 0)
              }
            }, 0)
          }
        }

        /**
         * Load playlists saved in localStorage
         * Filters for files ending in .m3u
         */
        loadSavedPlaylists() {
          // Get all keys from localStorage that end with .m3u
          const savedPlaylists = Object.keys(localStorage).filter(key =>
            key.endsWith('.m3u')
          )
          this.setState({ savedPlaylists })
        }

        /**
         * Handle playlist selection from dropdown
         * @param {Event} e - Selection event
         */
        handlePlaylistSelect(e) {
          const playlistName = e.target.value
          if (!playlistName) return

          const m3uContent = localStorage.getItem(playlistName)
          if (m3uContent) {
            this.setState({ selectedPlaylist: playlistName })
            this.parseM3U(m3uContent)
          }
        }

        /**
         * Fetch playlist from URL
         * @param {string} url - URL of playlist to fetch
         * @returns {Promise} - Resolves when playlist is loaded
         */
        fetchPlaylist(url) {
          console.log('Fetching playlist from:', url)
          return fetch(url)
            .then(res => {
              console.log('Fetch response status:', res.status)
              return res.text()
            })
            .then(data => {
              console.log(
                'Received playlist data:',
                data.substring(0, 200) + '...'
              )
              this.parseM3U(data)
            })
            .catch(err => {
              console.error('Error loading playlist:', err)
              this.loadFallbackPlaylist()
            })
        }

        /**
         * Load fallback playlist from embedded data
         */
        loadFallbackPlaylist() {
          try {
            const fallbackData =
              document.getElementById('playlist-data').textContent
            this.parseM3U(fallbackData)
          } catch (err) {
            console.error('Error loading fallback playlist:', err)
          }
        }

        /**
         * Parse M3U format playlist text into structured data
         * @param {string} m3uText - Raw M3U playlist content
         */
        parseM3U(m3uText) {
          console.log('Parsing M3U content...')
          const lines = m3uText
            .split('\n')
            .map(line => line.trim())
            .filter(line => line)
          console.log('Found lines:', lines.length)
          const playlist = []
          let currentTitle = null
          let startTime = null

          // Get the base URL from the query string if it exists
          const urlParams = new URLSearchParams(window.location.search)
          const playlistURL = urlParams.get('playlist')
          const baseURL = playlistURL
            ? new URL(playlistURL, window.location.href).href.replace(
                /[^/]*$/,
                ''
              )
            : ''

          const getFilenameFromUrl = url => {
            const cleanUrl = url.split('?')[0].split('#')[0]
            const filename = cleanUrl.split('/').pop()
            return filename ? filename.substring(0, 30) : 'Unknown'
          }

          for (let i = 0; i < lines.length; i++) {
            console.log('Processing line:', lines[i])
            if (lines[i].startsWith('#EXTINF:')) {
              currentTitle = lines[i].split(',')[1]
            } else if (lines[i].startsWith('#EXTVLCOPT:start-time=')) {
              startTime = parseFloat(lines[i].split('=')[1])
            } else if (!lines[i].startsWith('#')) {
              const title = currentTitle || getFilenameFromUrl(lines[i])
              const url = lines[i]

              if (url.startsWith('file://') || !url.match(/^[a-zA-Z]+:\/\//)) {
                if (baseURL && baseURL.startsWith('http')) {
                  playlist.push({
                    title: title,
                    url: new URL(url, baseURL).href,
                    isLocal: false,
                    startTime: startTime
                  })
                } else {
                  playlist.push({
                    title: title,
                    url: url,
                    isLocal: true,
                    localPath: url.replace('file://', ''),
                    startTime: startTime
                  })
                }
              } else {
                playlist.push({
                  title: title,
                  url: url,
                  isLocal: false,
                  startTime: startTime
                })
              }
              currentTitle = null
              startTime = null
            }
          }

          console.log('Parsed playlist:', playlist)
          this.setState({ playlist })
        }

        /**
         * Open file system dialog to select media directory
         * @async
         */
        async selectDirectory() {
          try {
            const dirHandle = await window.showDirectoryPicker()
            this.setState({ directoryHandle: dirHandle })

            // Store handles for all media files in the directory
            const fileHandles = new Map()
            for await (const entry of dirHandle.values()) {
              if (
                entry.kind === 'file' &&
                entry.name.match(/\.(mp4|webm|mkv|avi|mp3|wav|ogg|m4a)$/i)
              ) {
                fileHandles.set(entry.name, entry)
              }
            }
            this.setState({ fileHandles })
          } catch (error) {
            if (error.name !== 'AbortError') {
              console.error('Error accessing directory:', error)
            }
          }
        }

        /**
         * Play selected media item
         * @async
         * @param {Object} item - Media item to play
         * @param {number} index - Index in playlist
         */
        async playMedia(item, index) {
          console.log('playMedia called with item:', item)
          const shouldAutoplay = this.state.isPlayingAll

          // Prepare next media for preloading if playing all
          if (
            this.state.isPlayingAll &&
            index < this.state.playlist.length - 1
          ) {
            const nextItem = this.state.playlist[index + 1]
            let nextUrl = null

            if (nextItem.url instanceof File) {
              nextUrl = URL.createObjectURL(nextItem.url)
            } else if (nextItem.isLocal && this.state.directoryHandle) {
              const filename = nextItem.localPath.split('/').pop()
              const fileHandle = this.state.fileHandles.get(filename)
              if (fileHandle) {
                const file = await fileHandle.getFile()
                nextUrl = URL.createObjectURL(file)
              }
            } else {
              try {
                nextUrl = new URL(nextItem.url, window.location.href).href
              } catch (error) {
                console.error('Invalid next URL:', error)
              }
            }

            this.setState({ nextMedia: nextUrl })
          } else {
            this.setState({ nextMedia: null })
          }

          // Set current media
          let currentUrl = null
          if (item.url instanceof File) {
            currentUrl = URL.createObjectURL(item.url)
          } else if (item.isLocal && this.state.directoryHandle) {
            const filename = item.localPath.split('/').pop()
            const fileHandle = this.state.fileHandles.get(filename)
            if (fileHandle) {
              const file = await fileHandle.getFile()
              currentUrl = URL.createObjectURL(file)
            }
          } else {
            try {
              currentUrl = new URL(item.url, window.location.href).href
            } catch (error) {
              console.error('Invalid URL:', error)
            }
          }

          this.setState({ currentMedia: currentUrl }, () => {
            if (this.videoRef) {
              if (item.startTime != null) {
                this.videoRef.currentTime = item.startTime
              }
              this.videoRef
                .play()
                .catch(e => console.error('Playback failed:', e))
            }
          })
        }

        /**
         * Handle file selection from file input
         * @param {Event} e - File input change event
         */
        handleFileSelect(e) {
          const file = e.target.files[0]
          if (!file) return

          if (file.name.endsWith('.m3u') || file.name.endsWith('.m3u8')) {
            // Handle M3U playlist file
            const reader = new FileReader()
            reader.onload = e => {
              const content = e.target.result
              const filename = file.name
              localStorage.setItem(filename, content)
              this.loadSavedPlaylists()
              this.setState({ selectedPlaylist: filename })
              this.parseM3U(content)
            }
            reader.readAsText(file)
          } else {
            // Handle media file
            const mediaUrl = URL.createObjectURL(file)
            this.setState({
              playlist: [
                ...this.state.playlist,
                {
                  title: file.name,
                  url: file, // Store the file object directly
                  isLocal: true
                }
              ]
            })
          }
        }

        /**
         * Start playing all items in playlist sequentially
         */
        playAll() {
          if (this.state.playlist.length > 0) {
            this.setState({ isPlayingAll: true, currentIndex: 0 }, () => {
              const firstItem = this.state.playlist[0]
              this.playMedia(firstItem, 0).then(() => {
                // Force play the video after it's loaded
                if (this.videoRef) {
                  this.videoRef
                    .play()
                    .catch(e => console.error('Autoplay failed:', e))
                }
              })
            })
          }
        }

        /**
         * Handle media playback end
         * Advances to next track if playing all
         */
        handleMediaEnd = () => {
          if (
            this.state.isPlayingAll &&
            this.state.currentIndex < this.state.playlist.length - 1
          ) {
            const nextIndex = this.state.currentIndex + 1
            this.setState({ currentIndex: nextIndex }, () => {
              const nextItem = this.state.playlist[nextIndex]
              this.playMedia(nextItem, nextIndex).then(() => {
                // Force play the next video after it's loaded
                if (this.videoRef) {
                  this.videoRef
                    .play()
                    .catch(e => console.error('Autoplay failed:', e))
                }
              })
            })
          } else {
            this.setState({ isPlayingAll: false, currentIndex: 0 })
          }
        }

        /**
         * Render component
         * @returns {VNode} Virtual DOM node
         */
        render() {
          console.log('Rendering with playlist:', this.state.playlist)
          return html`
            <div id="app">
              <div class="playlist">
                <div class="file-input-wrapper">
                  <button
                    class="file-input-button"
                    onClick=${() => this.selectDirectory()}
                  >
                    Select Media Directory
                  </button>
                  <input
                    type="file"
                    accept=".m3u,.m3u8,video/*,audio/*"
                    id="file-input"
                    style="display: none"
                    onChange=${e => this.handleFileSelect(e)}
                  />
                  <button
                    class="file-input-button"
                    onClick=${() =>
                      document.getElementById('file-input').click()}
                  >
                    Open M3U or Media File
                  </button>
                  ${(() => {
                    const urlParams = new URLSearchParams(
                      window.location.search
                    )
                    const playlistURL = urlParams.get('playlist')
                    return playlistURL
                      ? html`
                          <button
                            class="file-input-button"
                            onClick=${() => {
                              fetch(playlistURL)
                                .then(res => res.text())
                                .then(content => {
                                  this.setState({
                                    showModal: true,
                                    modalContent: content
                                  })
                                })
                            }}
                          >
                            Show Playlist Content
                          </button>
                        `
                      : null
                  })()}
                </div>

                <select
                  class="playlist-selector"
                  value=${this.state.selectedPlaylist}
                  onChange=${e => this.handlePlaylistSelect(e)}
                >
                  <option value="">Select a saved playlist</option>
                  ${Array.isArray(this.state.savedPlaylists)
                    ? this.state.savedPlaylists.map(
                        name => html`<option value=${name}>${name}</option>`
                      )
                    : null}
                </select>

                ${this.state.playlist.length > 0
                  ? html`
                      <button
                        class="play-all-button"
                        onClick=${() => this.playAll()}
                      >
                        ${this.state.isPlayingAll
                          ? 'Playing All...'
                          : 'Play All'}
                      </button>
                    `
                  : null}
                ${!Array.isArray(this.state.playlist) ||
                this.state.playlist.length === 0
                  ? html`<p class="loading">Loading playlist...</p>`
                  : Array.isArray(this.state.playlist) &&
                    this.state.playlist.map(
                      (item, index) => html`
                        <div
                          class="playlist-item"
                          onclick=${() => {
                            console.log('Playlist item clicked:', item)
                            this.setState(
                              { currentIndex: index, isPlayingAll: false },
                              () => {
                                this.playMedia(item, index)
                              }
                            )
                          }}
                          title="${item.title}${item.isLocal
                            ? ' (Local File)'
                            : ''}"
                        >
                          ${item.title}${item.isLocal ? ' 📁' : ''}
                        </div>
                      `
                    )}
              </div>
              <div class="media">
                ${this.state.currentMedia
                  ? html`
                      <div>
                        <video
                          ref=${ref => (this.videoRef = ref)}
                          src="${this.state.currentMedia}"
                          controls
                          autoplay=${this.state.isPlayingAll}
                          muted=${false}
                          controlsList="nodownload"
                          preload="auto"
                          playsinline
                          style="width: 100%; height: 100%; object-fit: contain;"
                          onError=${e => console.error('Video error:', e)}
                          onEnded=${this.handleMediaEnd}
                        ></video>
                        ${this.state.nextMedia
                          ? html`
                              <video
                                ref=${ref => (this.nextVideoRef = ref)}
                                src="${this.state.nextMedia}"
                                preload="auto"
                                style="display: none;"
                              ></video>
                            `
                          : null}
                      </div>
                    `
                  : html`<p>Select a media file to play</p>`}
              </div>
              ${this.state.showModal
                ? html`
                    <div class="modal-overlay">
                      <div class="modal-content">
                        <button
                          class="modal-close"
                          onClick=${() =>
                            this.setState({
                              showModal: false,
                              modalContent: ''
                            })}
                        >
                          ×
                        </button>
                        <h3>Playlist Content</h3>
                        <pre class="modal-text">${this.state.modalContent}</pre>
                      </div>
                    </div>
                  `
                : null}
            </div>
          `
        }
      }

      render(h(M3UPlayer, null), document.getElementById('app'))
    </script>
  </body>
</html>
